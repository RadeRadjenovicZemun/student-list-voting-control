<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одјављени сте</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #17212b; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #d7e0ea; border-radius: 10px; box-shadow: 0 14px 38px #17212b16; }
    h1 { margin: 0 0 10px; font-size: 23px; }
    p { color: #526273; line-height: 1.5; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Одјављени сте / You are logged out</h1>
    <p>Ваша веза са сервером је затворена. За поновни приступ отворите адресу сервера и затражите одобрење.</p>
    <p>Your connection to the server has been closed. To reconnect, open the server address and request approval.</p>
  </main>
</body>
</html>
