<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приступ је опозван</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #17212b; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #d7e0ea; border-radius: 10px; box-shadow: 0 14px 38px #17212b16; }
    h1 { margin: 0 0 10px; font-size: 23px; }
    p { color: #526273; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Приступ је опозван</h1>
    <p>Локални оператор је прекинуо вашу сесију. За поновни приступ потребно је да пошаљете нови захтев и добијете одобрење.</p>
  </main>
</body>
</html>
