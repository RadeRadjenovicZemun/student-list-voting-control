<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приступ контролној табли</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #17212b; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #d7e0ea; border-radius: 10px; box-shadow: 0 14px 38px #17212b16; }
    h1 { margin: 0 0 10px; font-size: 23px; }
    p { color: #526273; line-height: 1.5; }
    #status { min-height: 24px; margin: 18px 0; font-weight: 600; }
    form { display: none; gap: 10px; }
    form.visible { display: flex; }
    input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid #aebdcc; border-radius: 6px; font-size: 20px; letter-spacing: 5px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #1d4ed8; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 20px; color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Приступ контролној табли</h1>
    <p>Захтев је послат локалном оператору. Када буде одобрен, унесите шестоцифрени код који вам оператор достави.</p>
    <div id="status" role="status" aria-live="polite">Чека се одобрење…</div>
    <form id="codeForm">
      <input id="accessCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-label="Шестоцифрени код" required>
      <button id="verifyButton" type="submit">Потврди</button>
    </form>
    <div id="error" role="alert"></div>
  </main>
  <script>
    const statusElement = document.getElementById('status');
    const form = document.getElementById('codeForm');
    const errorElement = document.getElementById('error');
    let terminal = false;

    async function pollRequest() {
      if (terminal) return;
      try {
        const response = await fetch('/access/status', { cache: 'no-store' });
        const result = await response.json();
        if (result.status === 'pending') {
          statusElement.textContent = 'Захтев је послат. Чека се одобрење…';
        } else if (result.status === 'approved') {
          statusElement.textContent = 'Захтев је одобрен. Унесите код за приступ.';
          form.classList.add('visible');
          document.getElementById('accessCode').focus();
        } else if (result.status === 'rejected') {
          terminal = true;
          statusElement.textContent = 'Захтев за приступ је одбијен.';
        } else if (result.status === 'locked') {
          terminal = true;
          statusElement.textContent = 'Захтев је закључан због превише погрешних покушаја.';
        } else {
          terminal = true;
          statusElement.textContent = 'Захтев је истекао. Освежите страницу да пошаљете нови захтев.';
        }
      } catch (error) {
        statusElement.textContent = 'Није могуће проверити статус захтева. Покушајте поново.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('verifyButton');
      button.disabled = true;
      errorElement.textContent = '';
      try {
        const response = await fetch('/access/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: document.getElementById('accessCode').value.trim() })
        });
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          errorElement.textContent = result.error === 'invalid-code' ? 'Код није исправан.' : 'Код је истекао или је захтев закључан.';
          if (response.status === 429 || response.status === 410) terminal = true;
          return;
        }
        terminal = true;
        location.replace('/');
      } finally {
        button.disabled = false;
      }
    });

    pollRequest();
    setInterval(pollRequest, 2500);
  </script>
</body>
</html>
